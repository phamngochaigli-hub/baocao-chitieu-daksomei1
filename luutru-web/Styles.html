<style>
  :root {
    --bg: #f4f6fa; --surface: #ffffff; --text: #1d2433; --muted: #5d6779; --border: #dde2ea;
    --primary: #1a56b8; --primary-ink: #ffffff; --primary-soft: #e8f0fc; --danger: #c0392b;
    --warn-bg: #fff6e0; --warn-ink: #7a5300; --ok: #1e7b4a; --header: #123b80;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d; --surface: #1b212b; --text: #e6e9ef; --muted: #9aa4b5; --border: #2e3644;
      --primary: #5b93ee; --primary-ink: #0d1420; --primary-soft: #1f2d45; --danger: #ef6b5b;
      --warn-bg: #3a3018; --warn-ink: #f2cf7a; --ok: #5cc98e; --header: #0f2550;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--primary); }
  [hidden] { display: none !important; }

  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 24px; background: var(--header); color: #fff; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-title { font-weight: 700; font-size: 19px; }
  .brand-sub { font-size: 12.5px; opacity: .8; }
  .user { display: flex; align-items: center; gap: 16px; font-size: 14px; }
  .user-email { background: rgba(255,255,255,.14); padding: 4px 12px; border-radius: 999px; }
  .link-light { color: #fff; opacity: .9; }

  .tabs { display: flex; gap: 4px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .tab { border: 0; background: none; padding: 14px 16px; font: inherit; font-weight: 600; color: var(--muted);
    border-bottom: 3px solid transparent; cursor: pointer; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

  main { max-width: 1080px; margin: 0 auto; padding: 24px; }
  .alert.error { background: #fdecea; color: #8a1f12; border: 1px solid #f3c2bb; padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; }

  .search { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .search-main { display: flex; gap: 8px; }
  .search-main input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); }
  .search-main input:focus, select:focus, textarea:focus, .edit input:focus { outline: 2px solid var(--primary); outline-offset: 0; }
  .search-filters { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .search-filters label { display: flex; flex-direction: column; font-size: 12.5px; color: var(--muted); gap: 4px; }
  select, .edit input, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 9px; font: inherit;
    font-weight: 600; font-size: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:hover { border-color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .btn.danger { color: var(--danger); }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .btn:disabled { opacity: .55; cursor: progress; }

  .result-count { margin: 18px 2px 10px; color: var(--muted); font-size: 14px; }
  .results { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; }
  .card-head { display: flex; gap: 14px; align-items: flex-start; }
  .badge-type { flex: none; min-width: 52px; text-align: center; padding: 8px 6px; border-radius: 8px;
    font-size: 12px; font-weight: 700; background: var(--primary-soft); color: var(--primary); }
  .badge-type.pdf { background: #fde8e6; color: #b3261e; }
  .badge-type.word { background: #e3ecfb; color: #1f4fa8; }
  .badge-type.excel { background: #e2f4ea; color: #1e7b4a; }
  .badge-type.ppt { background: #fdeee2; color: #b4531a; }
  .badge-type.img { background: #f1e8fb; color: #6b3fa0; }
  .card-title { min-width: 0; flex: 1; }
  .trich-yeu { font-weight: 600; font-size: 16.5px; line-height: 1.45; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 12.5px; padding: 2px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
  .chip.strong { color: var(--text); font-weight: 600; }
  .tom-tat { margin-top: 14px; padding: 12px 14px; border-left: 3px solid var(--primary); background: var(--primary-soft); border-radius: 0 10px 10px 0; }
  .tom-tat-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--primary); margin-bottom: 4px; }
  .tom-tat-text { white-space: pre-line; }
  .file-line { margin-top: 10px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .warn { margin-top: 10px; background: var(--warn-bg); color: var(--warn-ink); padding: 8px 12px; border-radius: 8px; font-size: 13.5px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .edit { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border); }
  .edit label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .edit .full { grid-column: 1 / -1; }

  .upload-opts { display: flex; flex-wrap: wrap; gap: 12px 18px; margin: 14px 0 0; padding: 12px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .upload-opts label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); min-width: 220px; flex: 1; }
  .upload-opts input { font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
  .chip.nhom { background: var(--primary-soft); color: var(--primary); border-color: transparent; font-weight: 600; }
  .ai-warn { background: var(--warn-bg); color: var(--warn-ink); padding: 10px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 14px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .seg button { font: inherit; font-weight: 600; font-size: 14px; padding: 9px 16px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .seg button.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .ai-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .ai-form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .ai-form .full { grid-column: 1 / -1; }
  .ai-form textarea, .ai-form input, .ai-form select { font: inherit; font-size: 14.5px; padding: 9px 11px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); color: var(--text); min-width: 0; }
  .ai-tk { border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px 14px; margin: 0; min-width: 0; }
  .ai-tk legend { font-size: 13px; font-weight: 600; color: var(--text); padding: 0 6px; }
  .ai-tk-hang { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-top: 8px; }
  .ai-tk-hang input[type=search] { flex: 1; min-width: 200px; }
  .ai-tk-hang label { flex: 1; min-width: 160px; }
  .ai-tim { max-height: 220px; overflow: auto; margin-top: 8px; }
  .ai-tim label { flex-direction: row; align-items: flex-start; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--border); color: var(--text); font-size: 13.5px; cursor: pointer; }
  .ai-chon { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ai-chon .chip button { border: 0; background: none; cursor: pointer; color: var(--danger); font-weight: 700; padding: 0 0 0 6px; }
  .hint-inline { color: var(--muted); font-size: 13.5px; }
  .ai-result { margin-top: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
  .ai-result-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .ai-doc { background: #fff; color: #111; border: 1px solid var(--border); border-radius: 8px; padding: 28px 34px; margin-bottom: 8px;
    font-family: "Times New Roman", Times, serif; font-size: 16px; line-height: 1.55; overflow-wrap: anywhere; }
  .ai-doc p { margin: 0 0 8px; text-align: justify; }
  .ai-doc h1, .ai-doc h2 { text-align: center; margin: 10px 0 6px; font-size: 17px; }
  .ai-doc h3 { font-size: 16px; margin: 14px 0 6px; }
  .ai-doc table { border-collapse: collapse; width: 100%; margin: 8px 0; }
  .ai-doc table.luoi th, .ai-doc table.luoi td { border: 1px solid #888; padding: 5px 8px; vertical-align: top; }
  .ai-doc table.luoi th { background: #eef1f6; }
  .ai-doc table.bang td { border: 0; padding: 2px 6px; }
  .ai-doc mark { background: #fff0a8; padding: 0 2px; }
  .ai-sua { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .ai-sua input { flex: 1; min-width: 220px; font: inherit; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
  .dropzone { display: block; text-align: center; padding: 40px 20px; border: 2px dashed var(--border); border-radius: 16px;
    background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; }
  .dropzone:hover, .dropzone.over { border-color: var(--primary); background: var(--primary-soft); }
  .dz-icon { font-size: 34px; }
  .dz-title { font-weight: 700; font-size: 17px; margin: 6px 0; }
  .dz-sub { color: var(--muted); font-size: 14px; }
  .hint { color: var(--muted); font-size: 13.5px; margin: 14px 2px; }

  .job { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
  .job .name { flex: 1; min-width: 0; word-break: break-all; font-weight: 500; }
  .job .st { font-size: 13.5px; color: var(--muted); }
  .job.err { border-color: #f3c2bb; } .job.err .st { color: var(--danger); }
  .spinner { width: 18px; height: 18px; border: 2.5px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .ok-tag { color: var(--ok); font-weight: 600; font-size: 13px; }

  @media (max-width: 640px) {
    .topbar, .tabs, main { padding-left: 16px; padding-right: 16px; }
    .search-main { flex-direction: column; }
    .edit, .ai-form { grid-template-columns: 1fr; }
    .ai-doc { padding: 16px 14px; }
    .tab { padding: 12px 8px; font-size: 14px; }
  }
</style>
