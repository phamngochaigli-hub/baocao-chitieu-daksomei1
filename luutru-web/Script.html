<script>
  var MAX_BYTES = 35 * 1024 * 1024;
  var DS_LOAI = [], DS_NHOM = [];

  function $(s, r) { return (r || document).querySelector(s); }
  function goi(ten) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, loi) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(loi);
      r[ten].apply(r, args);
    });
  }
  function thongBaoLoi(e) {
    var el = $('#loiChung');
    el.textContent = (e && e.message) || String(e);
    el.hidden = false;
    window.scrollTo(0, 0);
  }
  var CAC_TRUONG = ['trichYeu', 'soKyHieu', 'ngayBanHanh', 'loaiVanBan', 'coQuan', 'tomTat', 'nhomHoSo', 'kyHop', 'nhiemKy'];
  function ngayVN(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
    return m ? m[3] + '/' + m[2] + '/' + m[1] : (iso || '');
  }
  function kichThuoc(b) {
    b = +b || 0;
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(0) + ' KB';
    return (b / 1048576).toFixed(1) + ' MB';
  }
  function loaiFile(ten, mime) {
    var d = (String(ten).split('.').pop() || '').toLowerCase();
    if (d === 'pdf' || /pdf/.test(mime)) return ['PDF', 'pdf'];
    if (/^docx?$|^odt$|^rtf$/.test(d)) return [d.toUpperCase(), 'word'];
    if (/^xlsx?$|^ods$|^csv$/.test(d)) return [d.toUpperCase(), 'excel'];
    if (/^pptx?$|^odp$/.test(d)) return [d.toUpperCase(), 'ppt'];
    if (/^image\//.test(mime)) return [d.toUpperCase() || 'ẢNH', 'img'];
    return [(d && d.length <= 5 ? d.toUpperCase() : 'FILE'), ''];
  }

  // ---------- Tabs ----------
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('active', x === b); });
      document.querySelectorAll('.panel').forEach(function (p) { p.hidden = p.id !== 'tab-' + b.dataset.tab; });
    });
  });

  // ---------- Thẻ văn bản ----------
  function veThe(vb, canhBao) {
    var el = $('#tplCard').content.firstElementChild.cloneNode(true);
    var lf = loaiFile(vb.tenFile, vb.mimeType);
    var badge = $('.badge-type', el);
    badge.textContent = lf[0];
    if (lf[1]) badge.classList.add(lf[1]);
    capNhatNoiDungThe(el, vb);
    $('.btn-tai', el).href = vb.taiVe;
    $('.btn-xem', el).href = vb.link;
    if (canhBao && canhBao.length) { var w = $('.warn', el); w.textContent = '⚠️ ' + canhBao.join(' · '); w.hidden = false; }

    if (vb.coTheSua !== false) {
      $('.btn-sua', el).hidden = false;
      $('.btn-xoa', el).hidden = false;
    }
    var form = $('.edit', el);
    var sel = form.elements.loaiVanBan;
    ['' ].concat(DS_LOAI).forEach(function (l) { var o = document.createElement('option'); o.value = l; o.textContent = l || '—'; sel.appendChild(o); });
    if (DS_NHOM.length) {
      ['' ].concat(DS_NHOM).forEach(function (l) { var o = document.createElement('option'); o.value = l; o.textContent = l || '—'; form.elements.nhomHoSo.appendChild(o); });
      form.querySelectorAll('.hdnd-only').forEach(function (x) { x.hidden = false; });
    }

    $('.btn-sua', el).onclick = function () {
      CAC_TRUONG.forEach(function (k) { if (form.elements[k]) form.elements[k].value = vb[k] || ''; });
      form.hidden = !form.hidden;
    };
    $('.btn-huy', el).onclick = function () { form.hidden = true; };
    form.onsubmit = function (ev) {
      ev.preventDefault();
      var du = {};
      CAC_TRUONG.forEach(function (k) { if (form.elements[k] && (DS_NHOM.length || ['nhomHoSo', 'kyHop', 'nhiemKy'].indexOf(k) < 0)) du[k] = form.elements[k].value.trim(); });
      var nut = $('button[type=submit]', form); nut.disabled = true; nut.textContent = 'Đang lưu…';
      goi('capNhatVanBan', vb.id, du).then(function () {
        Object.assign(vb, du); capNhatNoiDungThe(el, vb); form.hidden = true;
      }).catch(thongBaoLoi).finally(function () { nut.disabled = false; nut.textContent = 'Lưu thay đổi'; });
    };
    $('.btn-xoa', el).onclick = function () {
      if (!confirm('Xoá văn bản "' + vb.trichYeu + '"?\nFile sẽ được chuyển vào thùng rác Google Drive.')) return;
      this.disabled = true;
      goi('xoaVanBan', vb.id).then(function () { el.remove(); }).catch(thongBaoLoi);
    };
    return el;
  }

  function capNhatNoiDungThe(el, vb) {
    $('.trich-yeu', el).textContent = vb.trichYeu || '(Chưa có trích yếu)';
    var meta = $('.meta', el);
    meta.innerHTML = '';
    [[vb.nhomHoSo, 'nhom'], [vb.kyHop && vb.kyHop + (vb.nhiemKy ? ' · NK ' + vb.nhiemKy : ''), 'nhom'], [vb.loaiVanBan, 'strong'],
      [vb.soKyHieu && 'Số: ' + vb.soKyHieu, 'strong'], [vb.ngayBanHanh && 'Ngày: ' + ngayVN(vb.ngayBanHanh)], [vb.coQuan]]
      .forEach(function (c) { if (!c[0]) return; var s = document.createElement('span'); s.className = 'chip' + (c[1] ? ' ' + c[1] : ''); s.textContent = c[0]; meta.appendChild(s); });
    $('.tom-tat-text', el).textContent = vb.tomTat || 'Không trích xuất được nội dung tóm tắt từ file này.';
    $('.file-line', el).textContent = '📎 ' + vb.tenFile + ' · ' + kichThuoc(vb.dungLuong) + ' · tải lên bởi ' + vb.nguoiTai +
      ' lúc ' + vb.thoiGianTai + (vb.nguonTrichXuat ? ' · trích xuất: ' + vb.nguonTrichXuat : '');
  }

  // ---------- Tìm kiếm ----------
  function timKiem() {
    var tc = { tuKhoa: $('#tuKhoa').value, loai: $('#locLoai').value, nam: $('#locNam').value, phamVi: $('#phamVi').value,
      nhom: $('#locNhom').value, kyHop: $('#locKyHop').value };
    var kq = $('#ketQua');
    $('#tomTatKetQua').innerHTML = '<span class="spinner" style="display:inline-block;vertical-align:middle"></span> Đang tìm…';
    goi('timKiem', tc).then(function (r) {
      kq.innerHTML = '';
      capNhatKyHop(r.dsKyHop || []);
      $('#tomTatKetQua').textContent = r.tong
        ? 'Tìm thấy ' + r.tong + ' văn bản' + (r.tong > r.ketQua.length ? ' (hiển thị ' + r.ketQua.length + ' văn bản mới nhất)' : '')
        : '';
      if (!r.tong) kq.innerHTML = '<div class="empty">Không tìm thấy văn bản phù hợp.</div>';
      r.ketQua.forEach(function (vb) { kq.appendChild(veThe(vb)); });
    }).catch(function (e) { $('#tomTatKetQua').textContent = ''; thongBaoLoi(e); });
  }
  function capNhatKyHop(ds) {
    var sel = $('#locKyHop'), cu = sel.value;
    if (Array.prototype.map.call(sel.options, function (o) { return o.value; }).slice(1).join('|') === ds.join('|')) return;
    sel.innerHTML = '<option value="">Tất cả</option>';
    ds.forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o); });
    sel.value = ds.indexOf(cu) >= 0 ? cu : '';
    var dl = $('#dsKyHopGoiY'); dl.innerHTML = '';
    var sa = $('#aiKyHop'), cuA = sa.value;
    sa.innerHTML = '<option value="">— Không —</option>';
    ds.forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = k; sa.appendChild(o); });
    sa.value = ds.indexOf(cuA) >= 0 ? cuA : '';
    ds.forEach(function (k) { var o = document.createElement('option'); o.value = k; dl.appendChild(o); });
  }
  $('#formTim').addEventListener('submit', function (e) { e.preventDefault(); timKiem(); });
  ['#locLoai', '#locNam', '#phamVi', '#locNhom', '#locKyHop'].forEach(function (s) { $(s).addEventListener('change', timKiem); });

  // ---------- Tải lên ----------
  var hangDoi = [], dangChay = false;
  function themFiles(files) {
    Array.prototype.forEach.call(files, function (f) {
      var job = document.createElement('div');
      job.className = 'job';
      job.innerHTML = '<span class="spinner"></span><span class="name"></span><span class="st">Đang chờ…</span>';
      $('.name', job).textContent = f.name + ' (' + kichThuoc(f.size) + ')';
      $('#hangDoi').prepend(job);
      if (f.size > MAX_BYTES) { baoLoiJob(job, 'Quá 35 MB — hãy tải thẳng vào thư mục Drive rồi bấm "Quét file mới".'); return; }
      hangDoi.push({ file: f, el: job, nhomHoSo: $('#upNhom').value, kyHop: $('#upKyHop').value.trim() });
    });
    chayHangDoi();
  }
  function baoLoiJob(job, msg) {
    job.classList.add('err');
    $('.spinner', job).remove();
    $('.st', job).textContent = '❌ ' + msg;
  }
  function docBase64(f) {
    return new Promise(function (ok, loi) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).split(',')[1] || ''); };
      r.onerror = function () { loi(new Error('Không đọc được file')); };
      r.readAsDataURL(f);
    });
  }
  function chayHangDoi() {
    if (dangChay || !hangDoi.length) return;
    dangChay = true;
    var j = hangDoi.shift();
    $('.st', j.el).textContent = 'Đang tải lên & trích xuất trích yếu…';
    docBase64(j.file).then(function (b64) {
      return goi('taiLenVanBan', { ten: j.file.name, mimeType: j.file.type, base64: b64, nhomHoSo: j.nhomHoSo, kyHop: j.kyHop });
    }).then(function (vb) {
      var the = veThe(vb, vb.canhBao);
      var tag = document.createElement('div'); tag.className = 'ok-tag'; tag.textContent = '✅ Đã lưu vào Google Drive — kiểm tra lại trích yếu, bấm "Sửa thông tin" nếu cần';
      the.prepend(tag);
      j.el.replaceWith(the);
    }).catch(function (e) { baoLoiJob(j.el, (e && e.message) || e); })
      .finally(function () { dangChay = false; chayHangDoi(); });
  }

  var dz = $('#dropzone');
  $('#chonFile').addEventListener('change', function () { themFiles(this.files); this.value = ''; });
  dz.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#chonFile').click(); } });
  ['dragenter', 'dragover'].forEach(function (t) { dz.addEventListener(t, function (e) { e.preventDefault(); dz.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (t) { dz.addEventListener(t, function (e) { e.preventDefault(); dz.classList.remove('over'); }); });
  dz.addEventListener('drop', function (e) { if (e.dataTransfer.files.length) themFiles(e.dataTransfer.files); });

  $('#btnQuet').addEventListener('click', function () {
    var nut = this; nut.disabled = true; nut.textContent = 'Đang quét…';
    goi('quetThuMuc').then(function (r) {
      r.moi.forEach(function (vb) { $('#hangDoi').prepend(veThe(vb, vb.canhBao)); });
      alert('Đã thêm ' + r.moi.length + ' file mới vào danh mục.' + (r.conLai ? '\nCòn ' + r.conLai + ' file, hãy bấm quét tiếp.' : ''));
    }).catch(thongBaoLoi).finally(function () { nut.disabled = false; nut.textContent = 'Quét file mới trong thư mục'; });
  });

  // ---------- Trợ lý AI (Gemini) ----------
  var AI = { che: 'soanthao', ids: {}, truoc: '', lanCuoi: null, tt: null };
  var CHE_VAN = {
    soanthao: { nut: 'Soạn thảo', loai: 'Loại văn bản cần soạn', mau: 'VD: Soạn Nghị quyết thông qua Kế hoạch phát triển kinh tế - xã hội năm 2028 của xã. Căn cứ Tờ trình của UBND xã, Báo cáo thẩm tra của Ban Kinh tế - Xã hội. Nêu các chỉ tiêu chính: …' },
    phantich: { nut: 'Phân tích', loai: '', mau: 'VD: So sánh các ý kiến, kiến nghị cử tri qua các kỳ họp và nêu nhóm vấn đề được quan tâm nhiều nhất; hoặc: Các nghị quyết đã ban hành có nội dung nào chưa được báo cáo kết quả thực hiện?' },
    baocao: { nut: 'Lập báo cáo', loai: 'Loại báo cáo', mau: 'VD: Lập báo cáo kết quả Kỳ họp thứ 3, nêu kết quả các nội dung đã thông qua, số liệu chính, ý kiến chất vấn, nhiệm vụ sau kỳ họp.' }
  };

  function aiDatChe(che) {
    AI.che = che;
    document.querySelectorAll('#aiChe button').forEach(function (b) { b.classList.toggle('on', b.dataset.che === che); });
    var cv = CHE_VAN[che], sel = $('#aiLoai');
    $('#aiLoaiLbl').hidden = !cv.loai;
    $('#aiLoaiTen').textContent = cv.loai;
    var ds = che === 'baocao' ? AI.tt.loaiBaoCao : AI.tt.loaiSoan;
    sel.innerHTML = '';
    ds.forEach(function (l) { var o = document.createElement('option'); o.value = l; o.textContent = l; sel.appendChild(o); });
    $('#aiYeuCau').placeholder = cv.mau;
    $('#aiChay').textContent = cv.nut;
    var vanBan = che !== 'phantich';
    $('#aiCoQuanLbl').hidden = !vanBan; $('#aiDiaDanhLbl').hidden = !vanBan;
  }
  document.querySelectorAll('#aiChe button').forEach(function (b) { b.addEventListener('click', function () { if (AI.tt) aiDatChe(b.dataset.che); }); });

  function veChipChon() {
    var kv = $('#aiDaChon'); kv.innerHTML = '';
    Object.keys(AI.ids).forEach(function (id) {
      var s = document.createElement('span'); s.className = 'chip strong';
      s.appendChild(document.createTextNode(AI.ids[id]));
      var x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.title = 'Bỏ chọn';
      x.onclick = function () { delete AI.ids[id]; veChipChon(); var cb = $('#aiKetQuaTim input[value="' + id + '"]'); if (cb) cb.checked = false; };
      s.appendChild(x); kv.appendChild(s);
    });
  }
  function aiTim() {
    var kq = $('#aiKetQuaTim'); kq.textContent = 'Đang tìm…';
    goi('timKiem', { tuKhoa: $('#aiTim').value, phamVi: 'tatCa' }).then(function (r) {
      kq.innerHTML = '';
      if (!r.ketQua.length) { kq.textContent = 'Không có tài liệu phù hợp.'; return; }
      r.ketQua.slice(0, 30).forEach(function (vb) {
        var lb = document.createElement('label'), cb = document.createElement('input');
        cb.type = 'checkbox'; cb.value = vb.id; cb.checked = !!AI.ids[vb.id];
        var nhan = (vb.trichYeu || vb.tenFile) + (vb.soKyHieu ? ' (' + vb.soKyHieu + ')' : '') + (vb.kyHop ? ' · ' + vb.kyHop : '');
        cb.onchange = function () { if (cb.checked) AI.ids[vb.id] = nhan.length > 70 ? nhan.slice(0, 70) + '…' : nhan; else delete AI.ids[vb.id]; veChipChon(); };
        lb.appendChild(cb); lb.appendChild(document.createTextNode(' ' + nhan)); kq.appendChild(lb);
      });
    }).catch(function (e) { kq.textContent = ''; thongBaoLoi(e); });
  }
  $('#aiTimNut').addEventListener('click', aiTim);
  $('#aiTim').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); aiTim(); } });

  function aiDangChay(bat, msg) {
    ['aiChay', 'aiSua', 'aiDocs', 'aiChep'].forEach(function (id) { $('#' + id).disabled = bat; });
    $('#aiTrangThai').innerHTML = bat ? '<span class="spinner" style="display:inline-block;vertical-align:middle"></span> ' + msg : '';
  }
  function aiHienKetQua(r, yc) {
    AI.truoc = r.text; AI.lanCuoi = yc;
    $('#aiKetQua').hidden = false;
    $('#aiVanBan').innerHTML = r.html;
    $('#aiThongTin').textContent = 'Mô hình ' + r.model + ' · còn ' + r.conLai + ' lượt hôm nay';
    var gc = $('#aiGhiChu'); gc.hidden = !r.ghiChu; gc.textContent = r.ghiChu ? '📝 Ghi chú cho người soạn: ' + r.ghiChu : '';
    var cb = $('#aiCanhBao'); cb.hidden = !(r.canhBao && r.canhBao.length); cb.textContent = '⚠️ ' + (r.canhBao || []).join(' · ');
    $('#aiNguon').textContent = r.taiLieu.length ? 'Tài liệu đã dùng: ' + r.taiLieu.map(function (t) { return '[' + t.ma + '] ' + (t.trichYeu || t.id) + (t.soKyHieu ? ' (' + t.soKyHieu + ')' : ''); }).join(' · ') : '';
    $('#aiDocsKq').textContent = ''; $('#aiChiDan').value = '';
    $('#aiKetQua').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function aiGui(yc, msg) {
    aiDangChay(true, msg);
    goi('troLyAI', yc).then(function (r) { aiHienKetQua(r, yc); }).catch(thongBaoLoi).finally(function () { aiDangChay(false); });
  }
  $('#formAI').addEventListener('submit', function (e) {
    e.preventDefault();
    var yc = { che: AI.che, loai: AI.che === 'phantich' ? '' : $('#aiLoai').value, yeuCau: $('#aiYeuCau').value,
      coQuan: $('#aiCoQuan').value, diaDanh: $('#aiDiaDanh').value, ids: Object.keys(AI.ids),
      loc: { kyHop: $('#aiKyHop').value, nhom: $('#aiNhom').value }, mucChiTiet: $('#aiMuc').value };
    $('#loiChung').hidden = true;
    aiGui(yc, 'Gemini đang xử lý, có thể mất 30–90 giây…');
  });
  $('#aiSua').addEventListener('click', function () {
    var cd = $('#aiChiDan').value.trim();
    if (!cd || !AI.lanCuoi) { thongBaoLoi(new Error('Hãy nhập yêu cầu chỉnh sửa.')); return; }
    $('#loiChung').hidden = true;
    aiGui(Object.assign({}, AI.lanCuoi, { truoc: AI.truoc, chiDan: cd }), 'Gemini đang chỉnh sửa…');
  });
  $('#aiChep').addEventListener('click', function () {
    var vung = $('#aiVanBan'), sel = window.getSelection(), rg = document.createRange();
    rg.selectNodeContents(vung); sel.removeAllRanges(); sel.addRange(rg);
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    sel.removeAllRanges();
    $('#aiDocsKq').textContent = ok ? '✅ Đã sao chép, dán vào Word hoặc Google Docs.' : 'Không sao chép được tự động. Hãy bôi đen văn bản và nhấn Ctrl + C.';
  });
  $('#aiDocs').addEventListener('click', function () {
    var tieuDe = (AI.lanCuoi && AI.lanCuoi.loai) || 'Bản thảo';
    aiDangChay(true, 'Đang tạo Google Docs…');
    goi('taoGoogleDocs', tieuDe, AI.truoc).then(function (r) {
      var kv = $('#aiDocsKq'); kv.innerHTML = '✅ Đã tạo: ';
      var a = document.createElement('a'); a.href = r.link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = r.ten; kv.appendChild(a);
      kv.appendChild(document.createTextNode(' (lưu trong thư mục BanThao_AI)'));
    }).catch(thongBaoLoi).finally(function () { aiDangChay(false); });
  });

  // ---------- Khởi động ----------
  goi('layThongTinBanDau').then(function (tt) {
    DS_LOAI = tt.loaiVanBan;
    DS_NHOM = tt.nhomHoSo || [];
    document.title = tt.tenApp;
    AI.tt = tt;
    if (tt.troLyAI) {
      $('#tabTroLy').hidden = false;
      $('#aiCoQuan').value = (tt.aiMacDinh || {}).coQuan || '';
      $('#aiDiaDanh').value = (tt.aiMacDinh || {}).diaDanh || '';
      (tt.nhomHoSo || []).forEach(function (l) { var o = document.createElement('option'); o.value = l; o.textContent = l; $('#aiNhom').appendChild(o); });
      aiDatChe('soanthao');
    }
    if (DS_NHOM.length) {
      document.querySelectorAll('.hdnd-only').forEach(function (x) { x.hidden = false; });
      DS_NHOM.forEach(function (l) {
        ['#locNhom', '#upNhom'].forEach(function (s) { var o = document.createElement('option'); o.value = l; o.textContent = l; $(s).appendChild(o); });
      });
    }
    $('#userEmail').textContent = tt.email;
    ['#linkThuMuc', '#linkThuMuc2'].forEach(function (s) { $(s).href = tt.linkThuMuc; $(s).hidden = false; });
    DS_LOAI.forEach(function (l) { var o = document.createElement('option'); o.value = l; o.textContent = l; $('#locLoai').appendChild(o); });
    for (var y = new Date().getFullYear() + 1; y >= 2000; y--) { var o = document.createElement('option'); o.value = y; o.textContent = y; $('#locNam').appendChild(o); }
    $('#trangThaiAI').textContent = tt.coAI
      ? '🤖 Đang dùng Claude AI để trích yếu và tóm tắt nội dung.'
      : 'ℹ️ Trích xuất theo thể thức văn bản hành chính. Cấu hình CLAUDE_API_KEY để tóm tắt nội dung chính xác hơn bằng AI.';
    timKiem();
  }).catch(thongBaoLoi);
</script>
